name: tourops
description: TourOps - Tour Operations mobile application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:       # CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for every Flutter project - DO NOT REMOVE
  flutter_localizations: # Required for GlobalMaterialLocalizations.delegate to enable automatic RTL layout
    sdk: flutter
  
  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR MODIFY
  supabase_flutter: ^2.9.1
  sizer: ^2.0.15              # Required for responsive design system
  flutter_svg: ^2.0.9        # Required for SVG icon support
  google_fonts: ^6.1.0       # Required for typography (replaces local fonts)
  shared_preferences: ^2.2.2 # Required for local data storage
  web: ^1.1.1
  
  # Feature dependencies - safe to modify
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  go_router: ^14.6.1
  permission_handler: ^13.0.2
  flutter_image_compress: ^2.5.1
  url_launcher: ^6.3.0
  image_picker: 1.1.2
  share_plus: ^12.0.2 # Resolves win32 conflict with file_picker (SharePlus.instance.share/ShareParams API is unchanged)
  path_provider: ^2.1.5
  geolocator: ^14.0.2 # Real GPS position stream with Android foreground service / iOS background updates for driver location sharing
  record: 6.1.2 # Real microphone recording to local file (Dart ^3.5 / Flutter >=3.24 compatible)
  just_audio: ^0.10.6 # Voice message playback with position/duration streams
  file_picker: ^11.0.3 # Real attachment picker (images, PDF, DOC/DOCX, XLS/XLSX, TXT) for Smart Chat, web + mobile
  video_player: ^2.9.2 # Inline video playback (MP4/WEBM) in chat bubbles and fullscreen player, web + Android
  pdfx: ^2.9.2 # Render first-page PDF preview and paged/zoomable PDF viewer, web + Android


  universal_html: ^2.3.0
dev_dependencies:
  flutter_test:    # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter   # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_lints: ^5.0.0 # CRITICAL: Required for code quality - DO NOT REMOVE

flutter:
  uses-material-design: true # CRITICAL: Required for Material icon font - DO NOT REMOVE
  assets:
    - assets/
    - assets/images/
  # CRITICAL ASSET MANAGEMENT RULES:
  # - DO NOT ADD NEW ASSET DIRECTORIES (assets/svg/, assets/icons/, etc.)
  # - ONLY USE EXISTING AND ITEMS AVAILABLE IN THE DIRECTORIES LISTED ABOVE (assets/, assets/images/)
  
  # CRITICAL FONTS RULE: 
  # - THIS PROJECT USES GOOGLE FONTS INSTEAD OF LOCAL FONTS
  # - DO NOT ADD ANY LOCAL FONTS SECTION OR FONT FILES
